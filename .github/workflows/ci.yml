name: CI

# ---------------------------------------------------------------------------------------------
# CI IS OFF — re-enable when there is budget for it.
#
# This repository is private, so Actions minutes are metered. Nothing below has been deleted;
# only the triggers changed. To turn automatic runs back on, restore:
#
#   on:
#     pull_request:
#     push:
#       branches: [main]
#
# Until then the gates still exist as commands — they are the `run:` steps below, and every one of
# them works on a laptop. Run them before pushing, because with this off nothing else will.
# ---------------------------------------------------------------------------------------------

on:
  # Manual only, so a run costs something only when someone asks for it. See the note above.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `--ignore-scripts` because the `prepare` script builds, and the build is a separate,
      # explicitly reported step below rather than a side effect of installing.
      - run: npm ci --ignore-scripts

      # The shared grammar fixture is byte-identical across four SDK repositories. If it has been
      # edited here alone, nothing else in this run is worth doing.
      - run: npm run fixture:verify

      # This repository is published. Nothing may name an internal identifier — see CONTRIBUTING.md.
      # The rules are shape rules plus a TRACKED term list (scripts/hygiene-terms.txt), so this
      # step enforces the same thing here as it does locally. The script proves every rule still
      # matches its own probe before it scans, so a category cannot quietly empty itself.
      - run: npm run hygiene

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --coverage
      - run: npm run build

      # publint and attw catch a broken `exports`/`types` shape, which is the most likely defect in
      # an ESM-only library and one no unit test can see.
      - run: npm run check:packaging

      # The RUNTIME dependency surface only: two packages with no transitive dependencies between
      # them. `--omit=dev` is the honest scope, not a way to be quiet — the known advisory in the
      # Expo config-plugin toolchain is a build-time concern documented in
      # docs/OPEN_QUESTIONS.md, and failing every build on it would train everyone to ignore this
      # step. A NEW high or critical advisory in something that actually ships fails the build.
      - run: npm run audit:runtime

# Not yet in this workflow, and deliberately not faked: the on-device grammar job. A green Jest run
# proves nothing about the JavaScript engine that actually ships — Jest runs on Node with full ICU.
# Running the same fixture inside an app on an Android emulator is the only check that can fail for
# the reason the fixture exists. See docs/OPEN_QUESTIONS.md, item 1.
