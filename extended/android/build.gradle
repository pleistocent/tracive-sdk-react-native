// Built only as part of a React Native app, which puts the Android and Kotlin Gradle plugins on the
// classpath and supplies the SDK levels below. The React Native plugin runs codegen from the
// `codegenConfig` in ../package.json and sets the Java and Kotlin targets.
apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

import groovy.json.JsonSlurper

// The version of the native SDK is the package's own, so the two cannot disagree.
def packageVersion = new JsonSlurper().parse(file("../package.json")).version

def safeExtGet(name, fallback) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
  namespace "id.tracive.sdk.extended.reactnative"
  compileSdk safeExtGet("compileSdkVersion", 36)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
  }
}

react {
  jsRootDir = file("../src/specs")
  libraryName = "TraciveSdkExtendedReactNativeSpec"
  codegenJavaPackageName = "id.tracive.sdk.extended.reactnative"
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "com.pleistocent:tracive-sdk-extended-ui:$packageVersion"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
  implementation "org.jetbrains.kotlinx:kotlinx-datetime:0.6.2"
}
